name: Apply history patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and verify the result
        run: |
          set -euo pipefail
          git apply -p1 --check .publish/history.patch
          git apply -p1 .publish/history.patch
          got="$(git hash-object public/processing.js)"
          want="31bc242c53c1230cb63ea2b89e1dc42a4dde8160"
          echo "result blob: $got"
          [ "$got" = "$want" ] || { echo "blob hash mismatch"; exit 1; }
          node --check public/processing.js
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .publish/history.patch .github/workflows/apply-history-patch.yml
          git add public/processing.js
          git commit -m "Show newest six processing and database history dates"
          git push origin HEAD:main

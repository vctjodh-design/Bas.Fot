<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Match — HoopsFixtures</title>
    <meta
      name="description"
      content="Full match page with score, Vitibet analytics, recent form, head-to-head and league table for basketball and football."
    />
    <link rel="preconnect" href="https://www.vitibet.com" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="court-glow" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand brand-link" href="/" aria-label="HoopsFixtures home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9">
            <circle cx="16" cy="16" r="12.5" />
            <path d="M3.5 16h25M16 3.5v25" />
            <path d="M6.6 6.6c5 2.4 8.3 5.4 9.4 9.4M25.4 25.4c-5-2.4-8.3-5.4-9.4-9.4" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>Hoops<span>Fixtures</span></h1>
          <p id="brandSub">Basketball &amp; football, any date</p>
        </div>
      </a>
      <div class="topbar-actions">
        <div class="live-dot" id="liveDot"><span></span>Live from Vitibet</div>
        <a class="btn ghost" id="backBtn" href="/">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4">
            <path d="M15 5l-7 7 7 7" />
          </svg>
          Back to fixtures
        </a>
      </div>
    </header>

    <main class="match-layout">
      <div id="matchRoot" class="match-root" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <span>HoopsFixtures · data scraped on demand from vitibet.com</span>
      <span id="stamp"></span>
    </footer>

    <script src="/match.js" defer></script>
  </body>
</html>
